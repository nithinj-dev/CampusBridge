<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — CampusBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8f9ff; }
        nav { background: white; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 12px rgba(0,0,0,0.07); }
        .logo { font-size: 20px; font-weight: 800; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header { background: linear-gradient(135deg, #1a1a2e, #16213e); color: white; padding: 40px 32px; }
        .header h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .header p  { opacity: 0.7; font-size: 15px; }
        .content { padding: 32px; max-width: 1200px; margin: 0 auto; }

        /* STAT CARDS */
        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); text-align: center; }
        .stat-card h3 { font-size: 36px; font-weight: 800; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stat-card p  { color: #888; margin-top: 4px; font-size: 14px; }

        /* TABLE */
        .table-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 16px rgba(0,0,0,0.06); }
        .table-header { padding: 20px 24px; border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between; align-items: center; }
        .table-header h3 { font-size: 16px; font-weight: 800; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8f9ff; padding: 12px 16px; text-align: left; font-size: 12px; color: #888; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px 16px; border-bottom: 1px solid #f8f8f8; font-size: 14px; }
        tr:last-child td { border-bottom: none; }
        tr:hover td { background: #fafbff; }
        .badge { padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .confirmed { background: #e8f5e9; color: #2e7d32; }
        .pending   { background: #fff8e1; color: #f57f17; }
        .cancelled { background: #ffebee; color: #c62828; }
        .back-btn { display: inline-block; margin-bottom: 20px; color: #667eea; text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">🎓 CampusBridge</div>
    <span style="font-size:13px;color:#888">Admin Panel</span>
</nav>

<div class="header">
    <h1>⚙️ Admin Dashboard</h1>
    <p>Complete overview of all platform activity</p>
</div>

<div class="content">
    <a href="landing.html" class="back-btn">← Back to Home</a>

    <div class="stat-grid">
        <div class="stat-card"><h3 id="statUsers">...</h3><p>Total Users</p></div>
        <div class="stat-card"><h3 id="statMentors">...</h3><p>Mentors</p></div>
        <div class="stat-card"><h3 id="statBookings">...</h3><p>Total Bookings</p></div>
        <div class="stat-card"><h3 id="statConfirmed">...</h3><p>Confirmed Sessions</p></div>
    </div>

    <div class="table-card">
        <div class="table-header">
            <h3>All Bookings</h3>
            <span style="font-size:13px;color:#aaa" id="bookingCount"></span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>#</th>
                    <th>Mentee</th>
                    <th>Mentor</th>
                    <th>University</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="bookingTable">
                <tr><td colspan="7" style="text-align:center;padding:32px;color:#aaa">Loading...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // Load stats
    Promise.all([
        fetch('/api/mentors').then(r => r.json()),
        fetch('/api/bookings').then(r => r.json())
    ]).then(([mentors, bookings]) => {
        document.getElementById('statUsers').textContent     = 10;
        document.getElementById('statMentors').textContent   = mentors.length;
        document.getElementById('statBookings').textContent  = bookings.length;
        document.getElementById('statConfirmed').textContent = bookings.filter(b => b.Status === 'confirmed').length;
        document.getElementById('bookingCount').textContent  = `${bookings.length} total`;

        const tbody = document.getElementById('bookingTable');
        tbody.innerHTML = '';
        if (bookings.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:32px">No bookings yet.</td></tr>';
            return;
        }
        bookings.forEach(b => {
            tbody.innerHTML += `
                <tr>
                    <td>#${b.Booking_ID}</td>
                    <td>${b.Mentee_Name}</td>
                    <td>${b.Mentor_Name}</td>
                    <td>${b.Uni_Name}</td>
                    <td>${b.Slot_Date}</td>
                    <td>${b.Start_Time} — ${b.End_Time}</td>
                    <td><span class="badge ${b.Status}">${b.Status}</span></td>
                </tr>
            `;
        });
    });
</script>
</body>
</html>
