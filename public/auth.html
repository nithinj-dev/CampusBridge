<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up / Login — CampusBridge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #f093fb 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .container {
            background: white; border-radius: 24px;
            padding: 48px 40px; width: 100%; max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
        }
        .logo { text-align: center; font-size: 28px; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #667eea, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tagline { text-align: center; color: #aaa; font-size: 14px; margin-bottom: 32px; }

        /* TABS */
        .tabs { display: flex; background: #f0f4ff; border-radius: 12px; padding: 4px; margin-bottom: 28px; }
        .tab {
            flex: 1; padding: 10px; text-align: center; border-radius: 10px;
            cursor: pointer; font-weight: 600; font-size: 14px; color: #888;
            transition: all 0.2s;
        }
        .tab.active { background: white; color: #667eea; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* ROLE SELECTOR */
        .role-selector { display: flex; gap: 12px; margin-bottom: 20px; }
        .role-btn {
            flex: 1; padding: 14px; border-radius: 12px; border: 2px solid #e8e8e8;
            cursor: pointer; text-align: center; transition: all 0.2s; background: white;
        }
        .role-btn:hover { border-color: #667eea; }
        .role-btn.selected { border-color: #667eea; background: #f0f4ff; }
        .role-btn .emoji { font-size: 28px; display: block; margin-bottom: 6px; }
        .role-btn .label { font-weight: 700; font-size: 14px; color: #333; }
        .role-btn .desc  { font-size: 12px; color: #888; margin-top: 2px; }

        label { display: block; font-weight: 600; font-size: 13px; color: #555; margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 12px 16px; border: 2px solid #e8e8e8;
            border-radius: 10px; font-size: 15px; margin-bottom: 16px;
            transition: border-color 0.2s; outline: none;
        }
        input:focus, select:focus { border-color: #667eea; }
        .row { display: flex; gap: 12px; }
        .row > div { flex: 1; }

        .btn-submit {
            width: 100%; padding: 14px; border-radius: 12px; border: none;
            background: linear-gradient(135deg, #667eea, #f093fb);
            color: white; font-size: 16px; font-weight: 700;
            cursor: pointer; margin-top: 4px; transition: opacity 0.2s;
        }
        .btn-submit:hover { opacity: 0.9; }

        .msg {
            margin-top: 16px; padding: 12px 16px; border-radius: 10px;
            font-size: 14px; font-weight: 600; display: none; text-align: center;
        }
        .success { background: #e8f5e9; color: #2e7d32; }
        .error   { background: #ffebee; color: #c62828; }
        .back { text-align: center; margin-top: 20px; font-size: 13px; color: #aaa; }
        .back a { color: #667eea; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <div class="logo">🎓 CampusBridge</div>
    <div class="tagline">Your gateway to university mentorship</div>

    <div class="tabs">
        <div class="tab active" onclick="switchTab('signup')">Create Account</div>
        <div class="tab" onclick="switchTab('login')">Log In</div>
    </div>

    <!-- SIGNUP FORM -->
    <div id="signupForm">
        <div class="role-selector">
            <div class="role-btn selected" id="menteeBtn" onclick="selectRole('mentee')">
                <span class="emoji">🎓</span>
                <div class="label">Mentee</div>
                <div class="desc">I need guidance</div>
            </div>
            <div class="role-btn" id="mentorBtn" onclick="selectRole('mentor')">
                <span class="emoji">👨‍🏫</span>
                <div class="label">Mentor</div>
                <div class="desc">I want to guide</div>
            </div>
        </div>
        <input type="hidden" id="selectedRole" value="mentee" />

        <div class="row">
            <div>
                <label>First Name</label>
                <input type="text" id="fname" placeholder="Rahul" />
            </div>
            <div>
                <label>Last Name</label>
                <input type="text" id="lname" placeholder="Verma" />
            </div>
        </div>
        <label>Email Address</label>
        <input type="email" id="email" placeholder="rahul@email.com" />
        <label>Country</label>
        <input type="text" id="country" placeholder="India" />

        <button class="btn-submit" onclick="register()">Create My Account →</button>
        <div class="msg" id="signupMsg"></div>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm" style="display:none">
        <label>Email Address</label>
        <input type="email" id="loginEmail" placeholder="your@email.com" />
        <button class="btn-submit" onclick="login()">Log In →</button>
        <div class="msg" id="loginMsg"></div>
    </div>

    <div class="back"><a href="landing.html">← Back to Home</a></div>
</div>

<script>
    let currentTab = 'signup';

    function switchTab(tab) {
        currentTab = tab;
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
        document.getElementById('loginForm').style.display  = tab === 'login'  ? 'block' : 'none';
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', (tab === 'signup' && i === 0) || (tab === 'login' && i === 1));
        });
    }

    function selectRole(role) {
        document.getElementById('selectedRole').value = role;
        document.getElementById('menteeBtn').classList.toggle('selected', role === 'mentee');
        document.getElementById('mentorBtn').classList.toggle('selected', role === 'mentor');
    }

    function showMsg(id, text, type) {
        const el = document.getElementById(id);
        el.textContent   = text;
        el.className     = 'msg ' + type;
        el.style.display = 'block';
    }

    function register() {
        const body = {
            fname   : document.getElementById('fname').value.trim(),
            lname   : document.getElementById('lname').value.trim(),
            email   : document.getElementById('email').value.trim(),
            role    : document.getElementById('selectedRole').value,
            country : document.getElementById('country').value.trim()
        };
        if (!body.fname || !body.lname || !body.email || !body.country)
            return showMsg('signupMsg', 'Please fill in all fields.', 'error');

        fetch('/api/register', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                // Save user info to sessionStorage
                sessionStorage.setItem('user_id',   data.user_id);
                sessionStorage.setItem('user_name', body.fname + ' ' + body.lname);
                sessionStorage.setItem('user_role', data.role);
                showMsg('signupMsg', '✅ Account created! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = data.role === 'mentor' ? 'mentor.html' : 'mentee.html';
                }, 1200);
            } else {
                showMsg('signupMsg', '❌ ' + data.error, 'error');
            }
        });
    }

    function login() {
        const email = document.getElementById('loginEmail').value.trim();
        if (!email) return showMsg('loginMsg', 'Please enter your email.', 'error');

        fetch('/api/login', {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        })
        .then(r => r.json())
        .then(data => {
            if (data.success) {
                sessionStorage.setItem('user_id',   data.user.User_ID);
                sessionStorage.setItem('user_name', data.user.Fname + ' ' + data.user.Lname);
                sessionStorage.setItem('user_role', data.user.Role);
                showMsg('loginMsg', '✅ Welcome back! Redirecting...', 'success');
                setTimeout(() => {
                    window.location.href = data.user.Role === 'mentor' ? 'mentor.html' : 'mentee.html';
                }, 1200);
            } else {
                showMsg('loginMsg', '❌ ' + data.error, 'error');
            }
        });
    }
</script>
</body>
</html>
